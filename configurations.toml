[project]
spec_path = "datasets/petstore.json"  # Path to your OpenAPI specification file (.json or .yaml). Must be OpenAPI 3.0. Relative to project root.
base_url = "https://petstore3.swagger.io/api/v3"  # Base URL of the API under test (e.g. http://localhost:30000/api/v4). If blank, extracted from spec servers field.
base_title = "pet2"  # Display name for this project, used in cache folder names and logs. Leave blank to auto-detect from spec.

[llm]
provider = "azure_openai"  # Which LLM backend to use: azure_openai | openai | gemini | ollama
model = "gpt-4.1-mini-2"  # Model name or Azure deployment ID. Must be a valid model for the chosen provider.
temperature = 0.7  # Controls how random or deterministic the model's responses are. 0.0 = always pick most likely token (safe). 1.0 = very random (creative but less predictable). Default: 0.7

[llm.azure_openai]
api_key = "${AZURE_OPENAI_API_KEY}"  # Your Azure OpenAI API key. Or use ${AZURE_OPENAI_API_KEY} env var.
endpoint = "${AZURE_OPENAI_ENDPOINT}"  # Your Azure OpenAI endpoint URL (e.g. https://my-resource.openai.azure.com).
api_version = "2024-12-01-preview"  # Azure OpenAI API version. Default: 2024-12-01-preview

[llm.openai]
api_key = "${OPENAI_API_KEY}"  # Your OpenAI API key. Or use ${OPENAI_API_KEY} env var.
base_url = "https://api.openai.com/v1"  # API base URL. Change this for OpenRouter, local proxies, etc. Default: https://api.openai.com/v1

[llm.gemini]
api_key = "${GOOGLE_API_KEY}"  # Your Google Gemini API key. Or use ${GOOGLE_API_KEY} env var.
project = ""  # Google Cloud project for Vertex AI (enterprise). Leave blank to use api_key instead.
location = ""  # Google Cloud region for Vertex AI. Required if Vertex project is set.

[llm.ollama]
base_url = "http://localhost:11434"  # Base URL of your Ollama server. Default: http://localhost:11434

[embedding]
provider = "huggingface"  # Which embedding backend to use: huggingface | ollama
model = "google/embeddinggemma-300m"  # Model name for embedding generation. For HuggingFace: a sentence-transformers model ID.
use_half = false  # Use float16 (half-precision) to reduce GPU memory usage. Slightly less accurate but much faster on limited hardware. y/n

[embedding.ollama]
base_url = "http://localhost:11434"  # Base URL of your Ollama server for embeddings. Default: http://localhost:11434

[run]
num_generations = 1  # Number of full test rounds to run. Each round rebuilds the operation dependency graph from scratch. More rounds = more thorough but slower.
num_test_cases = 10 # Number of test cases generated per endpoint per round. Higher = more coverage but slower.
mutation_ratio = 0.5  # Probability of intentionally breaking request parameters (e.g. sending invalid values) to test if the API returns proper 4xx errors. 0.0 = off, 0.5 = half mutated, 1.0 = all mutated.
header_mutation_ratio = 0.5  # Probability of fuzzing HTTP headers during testing. 0.0 = off, 0.5 = half fuzzed, 1.0 = all fuzzed.
async_mode = true  # Use async HTTP requests for much higher throughput when testing many endpoints. Recommended for large APIs. y/n
debug = false  # When true, skip the TUI and print logs to the terminal.
max_request_workers = 10  # Maximum number of parallel threads used during test execution. Controls how many endpoint trees run at the same time.
async_max_concurrent = 20  # Maximum number of simultaneous async HTTP requests allowed at once per worker thread.
